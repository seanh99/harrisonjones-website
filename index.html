<div class="mobile-menu" id="mobileMenu">

<main id="main">
  <section class="hero-stage" id="heroStage">
    <button class="hero-nav-zone is-prev" aria-label="Previous image"></button>
    <button class="hero-nav-zone is-next" aria-label="Next image"></button>

    <div class="hero-caption">
      <span id="heroCaptionTitle"></span>

    </div>
  </section>
</main>

<footer class="site-footer">

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="main.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script>
(function(){
  // Fallback (local files bundled with the site) in case Supabase Storage
  // is unreachable or no images are marked active yet.
  const FALLBACK = [
    { filename:'hero-01-entrance.jpg', format:'vertical' },
    { filename:'hero-02-dining.jpg', format:'horizontal' },
    { filename:'hero-03-living.jpg', format:'vertical' },
    { filename:'hero-06-spiral.jpg', format:'square' },
    { filename:'hero-04-sculpture.jpg', format:'vertical' },
    { filename:'hero-07-stairs.jpg', format:'horizontal' },
    { filename:'hero-05-staircase.jpg', format:'vertical' },
    { filename:'hero-08-door.jpg', format:'horizontal' },
  ].map(i => ({ ...i, caption: 'Private Residence', src: `assets/images/${i.filename}` }));

  function heroPublicUrl(filename){
    return supabaseClient.storage.from('hero-images').getPublicUrl(filename).data.publicUrl;
  }

  function renderSlides(images){
    const stage = document.getElementById('heroStage');
    const navZones = stage.querySelectorAll('.hero-nav-zone');

    images.forEach((img, idx) => {
      const slide = document.createElement('div');
      slide.className = 'hero-slide' + (idx === 0 ? ' is-active' : '');
      slide.dataset.format = img.format;
      slide.dataset.caption = img.caption;
      slide.innerHTML = `<img src="${img.src}" alt="${img.caption}">`;
      stage.insertBefore(slide, navZones[0]);
    });

    window.initHeroRotation();
  }

  async function loadHero(){
    try {
      // If Supabase is unreachable (e.g. DNS failure), the browser's own
      // connection retries can take several seconds before the query
      // promise ever settles. Race it against a short timeout so the
      // local fallback photos always appear almost immediately instead
      // of leaving the hero blank while that plays out.
      const query = supabaseClient
        .from('hero_images')
        .select('filename, format, caption')
        .eq('is_active', true)
        .order('sort_order', { ascending: true });
      const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2500));

      const { data, error } = await Promise.race([query, timeout]);

      if (error || !data || !data.length) {
        renderSlides(FALLBACK);
      } else {
        renderSlides(data.map(img => ({ ...img, src: heroPublicUrl(img.filename) })));
      }
    } catch {
      renderSlides(FALLBACK);
    }
  }

  loadHero();
})();
</script>
</body>
</html>
